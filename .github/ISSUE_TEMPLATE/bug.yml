name: Bug report
description: Report a problem in Olympus Mytikas.
body:
  - type: input
    id: addon
    attributes:
      label: Addon version
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: WoW flavor and build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error (if shown)
